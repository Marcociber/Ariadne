services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HISTORY_DB=/data/ariadne_history.db
      # The dashboard is served from :8080, so only that origin may call the
      # API. Change this (or set it in backend/.env) when you deploy.
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    # Optional keys (Shodan, HIBP) and any override of the settings above.
    # `required: false` keeps `docker compose up` working with no .env file,
    # which is why this used to be commented out entirely.
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ariadne-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # A username scan is network- and socket-intensive; keep it bounded.
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No published ports: reachable only on the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
      - ../assets:/usr/share/nginx/html/assets:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ariadne-data:
