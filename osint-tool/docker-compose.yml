services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HISTORY_DB=/data/ariadne_history.db
    # To enable key-based modules (Shodan, HIBP…), create backend/.env and
    # uncomment the next two lines:
    # env_file:
    #   - ./backend/.env
    volumes:
      - ariadne-data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend

volumes:
  ariadne-data:
