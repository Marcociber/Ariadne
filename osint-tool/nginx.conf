# nginx configuration for the ARIADNE dashboard.
#
# The default image config emitted no security headers at all, which was
# awkward for a tool whose `http` module audits exactly those headers on
# third-party sites. It also served everything uncompressed and uncached.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    charset utf-8;

    # ---- Security headers ----
    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header X-Frame-Options           "DENY"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                always;

    # Content-Security-Policy. This is only possible because the frontend no
    # longer uses inline scripts or inline event handlers.
    #   connect-src must list the API origin -> CHANGE IT WHEN YOU DEPLOY.
    #   img-src allows flagcdn.com for the country-flag images (there is an
    #   emoji fallback, so you may drop it for a zero-third-party page).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://flagcdn.com; font-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'" always;

    # ---- Compression ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;

    # ---- Caching ----
    # NOTE: `expires` is used instead of `add_header Cache-Control`. In nginx,
    # an `add_header` inside a location DISCARDS every add_header inherited
    # from the server block, so setting Cache-Control that way silently
    # dropped all the security headers above on exactly the two paths that
    # matter. `expires` sets Cache-Control without touching that inheritance.

    # The HTML entry point must always be revalidated so a deploy is picked up.
    location = /index.html {
        expires -1;
    }
    location /assets/ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
